name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, base ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: ZoomGame

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
